# 1. CONFIGURAÇÃO DO BACKEND
backend:
  name: firebase 
  use_json: true 
  
  # Chaves do Firebase (ANINHADAS em 'config')
  config:
    api_key: "AIzaSyC2cBfkKjT16srTeVYAedNgA6qOw0h97vc"
    auth_domain: "yb-make.firebaseapp.com"
    project_id: "yb-make"

# 2. CONFIGURAÇÕES GLOBAIS (NÃO ANINHADAS)
locale: "pt" # Deve estar fora do 'backend:'

publish_mode: editorial_workflow # Deve estar fora do 'backend:'

# 3. CONFIGURAÇÕES DE MÍDIA (NÃO ANINHADAS)
media_folder: "imagens/uploads"
public_folder: "imagens/uploads"

# 4. COLEÇÕES DE DADOS
collections:
  - name: "products"
    label: "Produtos"
    folder: "products" # O nome da coleção no Firestore
    create: true
    slug: "{{fields.title}}"
    fields:
      - {label: "Nome do Produto", name: "title", widget: "string"}
      - {label: "Descrição", name: "description", widget: "text"}
      - {label: "Preço", name: "price", widget: "number"}
      - {label: "Imagem do Produto", name: "image", widget: "image"}