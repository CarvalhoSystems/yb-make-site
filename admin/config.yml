backend:
  name: firebase 
  use_json: true # Define que os dados serão salvos em documentos JSON (correto)
  
  # 💥 A CORREÇÃO ESTÁ AQUI 💥
  config:
    api_key: "AIzaSyC2cBfkKjT16srTeVYAedNgA6qOw0h97vc"
    auth_domain: "yb-make.firebaseapp.com"
    project_id: "yb-make"
  # Fim da correção

locale: "pt" 

publish_mode: editorial_workflow

media_folder: "imagens/uploads"
public_folder: "imagens/uploads"

collections:
  - name: "products"
    label: "Produtos"
    folder: "products" # O nome da coleção no Firestore
    create: true
    slug: "{{fields.title}}"
    fields:
      - {label: "Nome do Produto", name: "title", widget: "string"}
      - {label: "Descrição", name: "description", widget: "text"}
      - {label: "Preço", name: "price", widget: "number"}
      - {label: "Imagem do Produto", name: "image", widget: "image"}