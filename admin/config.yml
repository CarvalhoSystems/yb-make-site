# 1. CONFIGURAÇÃO DO BACKEND
backend:
# 1. CONFIGURAÇÃO DO BACKEND (GitHub)
backend:
  name: github
  repo: "carvalhosystems/yb-make-site" # SEU USUÁRIO/SEU REPOSITÓRIO
  branch: principal # OU master, dependendo do seu branch principal
  
# Remova o bloco 'config:' do Firebase, se ele ainda existir.
# ...

# 2. CONFIGURAÇÕES GLOBAIS (NÃO ANINHADAS)
locale: "pt" 

publish_mode: editorial_workflow 

# 3. CONFIGURAÇÕES DE MÍDIA (NÃO ANINHADAS)
media_folder: "imagens/uploads"
public_folder: "imagens/uploads"

# 4. COLEÇÕES DE DADOS
collections:
  - name: "products"
    label: "Produtos"
    folder: "products" 
    create: true
    slug: "{{fields.title}}"
    fields:
      - {label: "Nome do Produto", name: "title", widget: "string"}
      - {label: "Descrição", name: "description", widget: "text"}
      - {label: "Preço", name: "price", widget: "number"}
      - {label: "Imagem do Produto", name: "image", widget: "image"}