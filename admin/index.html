<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administrador - YB MAKE's</title>
    <link rel="stylesheet" href="adm.css"> 
</head>
<body>

    <div class="admin-container">
        <!-- 1. SEÇÃO DE LOGIN -->
        <div id="login-section">
            <h2>Acesso Restrito</h2>
            <form class="form">
                <input type="email" id="admin-email" placeholder="Email de administrador">
                <input type="password" id="admin-password" placeholder="Senha">
                <button type="button" id="btn-admin-login">Entrar</button>
            </form>
            <p id="admin-error-message" class="error-message"></p>
            <a href="/yb-make-site/index.html" class="link-voltar">Voltar para a loja</a>
        </div>

        <!-- 2. PAINEL DE ADMINISTRAÇÃO (ESCONDIDO INICIALMENTE) -->
        <div id="admin-panel" class="hidden">
            <h2>Gerenciador de Produtos</h2>
            <button type="button" id="btn-admin-logout" class="btn-secondary" style="background: #6c757d; margin-bottom: 20px;">Sair</button>
            <hr style="margin: 20px 0;">

            <h3>Adicionar / Editar Produto</h3>
            <form class="form">
                <input type="hidden" id="product-id"> <!-- Campo oculto para guardar o ID do produto em edição -->
                <input type="text" id="product-title" placeholder="Nome do Produto">
                <textarea id="product-description" placeholder="Descrição"></textarea>
                <input type="number" id="product-price" placeholder="Preço (ex: 29.90)">
                <div class="file-upload-container">
                    <label for="product-file" class="file-upload-label">
                        <i class="fas fa-camera"></i> Escolher Imagem
                    </label>
                    <input type="file" id="product-file" accept="image/*" style= "display: none;">
                    <p id="file-name-display" style="font-size: 0.9em; color: #6c757d; margin-top: 10px;">Nenhuma imagem selecionada</p>
                    <p style="text-align: center; margin: 10px 0; color: #6c757d;">OU</p>
                    <input type="text" id="product-image-url-manual" placeholder="Cole a URL da imagem aqui (ex: https://exemplo.com/imagem.jpg)">
                    <input type="hidden" id="product-image"> <!-- URL da imagem após upload -->
                </div>
                <button type="button" id="btn-save-product">Salvar Produto</button>
            </form>

            <hr style="margin: 20px 0;">
            <h3>Produtos Cadastrados</h3>
            <div id="product-list-admin">
                <!-- Lista de produtos será carregada aqui -->
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-storage-compat.js"></script>

    <script src="../src/firebase-config.js"></script>
    <script src="admin.js"></script>

</body>
</html>
