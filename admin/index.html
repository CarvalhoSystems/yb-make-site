<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Conteúdo</title>
</head>
<body>
  <!-- O Decap CMS precisa de um elemento 'root' para renderizar a interface -->
  <div id="root"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

  <!-- Carrega os scripts do Decap CMS a partir de uma CDN confiável e com versões fixas -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.1.10/dist/decap-cms.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms-backend-firebase@3.0.1/dist/decap-cms-backend-firebase.js"></script>

  <script>
    // Define a configuração do CMS diretamente em JavaScript.
    const config = {
      backend: {
        name: "firebase",
        auth_type: "firebase",
        config: {
            apiKey: "AIzaSyC2cBfkKjT16srTeVYAedNgA6qOw0h97vc",
            authDomain: "yb-make.firebaseapp.com",
            projectId: "yb-make",
            storageBucket: "yb-make.firebasestorage.app",
            appId: "1:685414342925:web:9b17e3194f393c87569044",
        },
      },
      locale: "pt",
      publish_mode: "editorial_workflow",
      media_folder: "imagens/uploads",
      public_folder: "imagens/uploads",
      collections: [{
        name: "products",
        label: "Produtos",
        folder: "products",
        extension: "json",
        create: true,
        slug: "{{slug}}",
        fields: [
            { label: "Nome do Produto", name: "title", widget: "string" },
            { label: "Descrição", name: "description", widget: "text" },
            { label: "Preço", name: "price", widget: "number" },
            { label: "Imagem do Produto", name: "image", widget: "image" },
        ],
      }],
    };

    // 1. Inicializa o Firebase (necessário para o backend funcionar).
    firebase.initializeApp(config.backend.config);

    // 2. Registra o backend do Firebase manualmente no CMS.
    CMS.registerBackend('firebase', window.FirebaseBackend);

    // 3. Inicializa o CMS passando a configuração diretamente.
    CMS.init({ config });
  </script>
</body>
</html>
