<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Conteúdo</title>
</head>
<body>
  
  <!-- O Decap CMS precisa de um elemento 'root' para renderizar a interface -->
  <div id="root"></div>

  <!-- Carrega os SDKs do Firebase v8 (compatível com o backend do Decap CMS) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

  <!-- 1. Carrega o Decap CMS principal -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <!-- 2. Carrega o backend do Firebase (usando jsDelivr) -->
  <script src="https://cdn.jsdelivr.net/npm/decap-cms-backend-firebase@^3.0.0/dist/decap-cms-backend-firebase.js"></script>

  <!-- 3. Inicializa tudo em ordem -->
  <script>
    // 3.1. Inicializa o Firebase v8.
    const firebaseConfig = {
      apiKey: "AIzaSyC2cBfkKjT16srTeVYAedNgA6qOw0h97vc",
      authDomain: "yb-make.firebaseapp.com",
      projectId: "yb-make",
      storageBucket: "yb-make.firebasestorage.app",
      appId: "1:685414342925:web:9b17e3194f393c87569044",
    };
    firebase.initializeApp(firebaseConfig);

    // 3.2. Registra o backend do Firebase manualmente no CMS.
    CMS.registerBackend('firebase', window.FirebaseBackend);

    // 3.3. Inicializa o Decap CMS.
    CMS.init();
  </script>
</body>
</html>
