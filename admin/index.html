<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Conteúdo</title>
</head>
<body>
  
  <!-- O Decap CMS precisa de um elemento 'root' para renderizar a interface -->
  <div id="root"></div>

  <!-- Carrega os SDKs do Firebase v8 (compatível com o backend do Decap CMS) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

  <!-- 1. Carrega o Decap CMS principal -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <!-- 2. Carrega o backend do Firebase -->
  <script src="https://unpkg.com/decap-cms-backend-firebase@^3.0.0/dist/decap-cms-backend-firebase.js" defer></script>

  <!-- 3. Carrega nosso script de inicialização, que será executado por último -->
  <script src="admin.js" defer></script>
</body>
</html>
