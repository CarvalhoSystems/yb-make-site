  <script>
    // A função window.onload garante que o DOM (HTML) está pronto para o CMS renderizar.

        firebase.initializeApp(firebaseConfig);

        // 3. REGISTRO DO BACKEND E INICIALIZAÇÃO DO CMS
        if (window.CMS && window.FirebaseBackend) {
            CMS.registerBackend('firebase', window.FirebaseBackend);
