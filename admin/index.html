<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Conteúdo</title>
</head>
<body>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/decap-cms@3.1.10/dist/decap-cms.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/decap-cms-backend-firebase@3.0.1/dist/decap-cms-backend-firebase.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Inicializa o Firebase v8 com o ID correto (minúsculas)
        const firebaseConfig = {
            apiKey: "AIzaSyC2cBfkKjT16srTeVYAedNgA6qOw0h97vc",
            authDomain: "yb-make.firebaseapp.com",
            projectId: "yb-make", // ID do projeto (minúsculas)
            storageBucket: "yb-make.firebasestorage.app",
            appId: "1:685414342925:web:9b17e3194f393c87569044",
        };
        // Apenas inicializa se o SDK do Firebase foi carregado
        if (typeof firebase !== 'undefined') {
            firebase.initializeApp(firebaseConfig);
        } else {
            console.error("Firebase SDK não foi carregado.");
            return;
        }

        // 2. Registra e Inicializa o CMS APENAS se os objetos existirem
        if (window.CMS && window.FirebaseBackend) {
            CMS.registerBackend('firebase', window.FirebaseBackend);
            CMS.init();
        } else {
            console.error("Erro: CMS ou Plugin Firebase não foram carregados/registrados corretamente.");
        }
    });
  </script>
</body>
</html>
