<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - YB_MAKE.com.br</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="admin/cadastro.css">
</head>
<body>

    <header class="main-header">
        <div class="container header-top">
            <a href="index.html" style="text-decoration: none;"><h1 class="titulo-loja">YB MAKE's Cosméticos</h1></a>
        </div>
    </header>

    <main class="auth-page-container">
        <h2>Crie sua Conta</h2>
        <p>Preencha os campos abaixo para se cadastrar.</p>

        <form id="signup-form" class="form">
            <label for="signup-name">Nome Completo</label>
            <input type="text" id="signup-name" placeholder="Seu nome completo" required>

            <label for="signup-dob">Data de Nascimento</label>
            <input type="date" id="signup-dob" required>

            <label for="signup-phone">Telefone</label>
            <input type="tel" id="signup-phone" placeholder="(11) 99999-9999" required>

            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" placeholder="seu.email@exemplo.com" required>

            <label for="signup-password">Senha (mínimo 6 caracteres)</label>
            <input type="password" id="signup-password" placeholder="Crie uma senha" required>

            <label for="signup-confirm-password">Confirmar Senha</label>
            <input type="password" id="signup-confirm-password" placeholder="Confirme sua senha" required>

            <p id="signup-error-message" class="error-message"></p>

            <button type="submit">Finalizar Cadastro</button>
        </form>
        <a href="index.html" class="link-voltar">Já tenho uma conta. Voltar para o login.</a>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore-compat.js"></script>
 
    <!-- Carrega e inicializa o Firebase a partir de um arquivo central -->
    <script src="src/firebase-config.js"></script>
    <script src="src/cadastro.js"></script>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2025 YB Make's Cosméticos. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
